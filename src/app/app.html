@if (isPublicRoute) {
  <router-outlet />
} @else {
  <nav class="navbar">
    <a class="navbar-brand" routerLink="/dashboard">
      <span class="brand-name">DocVault</span>
    </a>
    <div class="navbar-center">
      <button class="nav-link" routerLink="/documents" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="11" x2="12" y2="17"></line>
          <line x1="9" y1="14" x2="15" y2="14"></line>
        </svg>
        Documents
      </button>
    </div>
    <div class="navbar-actions">
      <button class="nav-icon-btn" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button class="nav-icon-btn" title="Settings" routerLink="/settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6"></path>
          <path d="M4.22 4.22l4.24 4.24m2.12-4.24l4.24-4.24M4.22 19.78l4.24-4.24m2.12 4.24l4.24 4.24M1 12h6m6 0h6"></path>
        </svg>
      </button>
      <button class="nav-avatar-btn" title="Profile" routerLink="/profile">
        <div class="avatar">CK</div>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet />
  </main>

  <app-chat-popup />
}
