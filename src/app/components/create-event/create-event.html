<button class="btn-create-event" (click)="openDialog()" title="Create new event">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
  New Event
</button>

<!-- Modal Backdrop -->
<div class="modal-backdrop" *ngIf="isOpen" (click)="handleBackdropClick()"></div>

<!-- Modal Dialog -->
<div class="modal-dialog" *ngIf="isOpen">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Create New Event</h2>
      <button class="modal-close" (click)="closeDialog()">✕</button>
    </div>

    <form class="modal-body" (ngSubmit)="submitForm()">
      <div class="form-group">
        <label for="title">Event Title *</label>
        <input
          id="title"
          type="text"
          class="form-input"
          placeholder="e.g., Buy new car"
          [(ngModel)]="formData.title"
          name="title"
          required
        />
      </div>

      <div class="form-group">
        <label for="type">Event Type</label>
        <select
          id="type"
          class="form-input"
          [(ngModel)]="formData.type"
          name="type"
        >
          <option *ngFor="let t of eventTypes" [value]="t.value">{{ t.title }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input
          id="date"
          type="date"
          class="form-input"
          [(ngModel)]="formData.date"
          name="date"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          class="form-input"
          placeholder="Optional description..."
          [(ngModel)]="formData.description"
          name="description"
          rows="3"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDialog()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!formData.title.trim()">Create Event</button>
      </div>
    </form>
  </div>
</div>
